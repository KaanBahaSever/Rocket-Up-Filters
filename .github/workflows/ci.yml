name: CI

on:
  push:
  pull_request:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure

  arduino:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fqbn: ["arduino:avr:uno", "esp32:esp32:esp32"]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: ${{ startsWith(matrix.fqbn, 'esp32') && 'esp32:esp32' || 'arduino:avr' }}
              source-url: ${{ startsWith(matrix.fqbn, 'esp32') && 'https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json' || '' }}
          libraries: |
            - source-path: ./
          sketch-paths: |
            - examples/HilFlightComputer
